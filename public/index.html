<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<title>Comment Box Generator</title>
	</head>
	<body>
		<h1>Comment Box Generator</h1>
		<form id="mainform">
			<label>
				Text
				<input
					id="text"
					type="text"
					name="text"
				/>
			</label>
			<label>
				Minimum width
				<input
					id="minwidth"
					type="number"
					name="minwidth"
					value="40"
				/>
			</label>
			<label>
				Comment type
				<select
					name="commenttype"
					id="commenttype"
				>
					<option value="python">Python/Bash (#)</option>
					<option value="c">C/JavaScript (//)</option>
					<option value="sql">SQL/Lua (--)</option>
					<option value="asm">Assembly (;)</option>
				</select>
			</label>
			<label>
				Multiline? (required for some languages)
				<label
					>Yes
					<input
						type="radio"
						name="ismultiline"
						value="yes"
					/>
				</label>
				<label
					>No
					<input
						type="radio"
						name="ismultiline"
						value="no"
						checked
					/>
				</label>
			</label>
			<input
				id="submit"
				type="submit"
				value="Submit"
			/>
		</form>
		<p>Output:</p>
		<textarea
			id="output"
			readonly
			cols="60"
			rows="4"
		>
		</textarea>
		<script src="main.js"></script>
	</body>
</html>
