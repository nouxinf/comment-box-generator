<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<title>Comment Box Generator</title>
		<link
			rel="stylesheet"
			href="styles.css"
		/>
	</head>
	<body>
		<div id="main">
			<h1>Comment Box Generator</h1>
			<form
				id="mainform"
				autocomplete="off"
			>
				<label>
					Text
					<input
						id="text"
						type="text"
						name="text"
					/>
				</label>
				<label>
					Minimum width
					<input
						id="minwidth"
						type="number"
						name="minwidth"
						value="40"
					/>
				</label>
				<label>
					Comment type
					<select
						name="commenttype"
						id="commenttype"
					>
						<option value="python">Python/Bash (#)</option>
						<option value="c">C/JavaScript (//)</option>
						<option value="sql">SQL (--)</option>
						<option value="asm">Assembly (;)</option>
						<option value="html">HTML (&lt;!-- --&gt;)</option>
					</select>
				</label>
				<label>
					Multiline? (required for some languages)
					<label
						>Yes
						<input
							type="radio"
							name="ismultiline"
							value="yes"
						/>
					</label>
					<label
						>No
						<input
							type="radio"
							name="ismultiline"
							value="no"
							checked
						/>
					</label>
				</label>
				<label>
					Box Symbol
					<select
						name="boxsymbol"
						id="boxsymbol"
					>
						<option value="parallel">Parallel lines</option>
						<option value="equals">Equals signs</option>
					</select>
				</label>
				<input
					id="submit"
					type="submit"
					value="Submit"
				/>
			</form>
			<p>Output:</p>
			<textarea
				id="output"
				readonly
				cols="50"
				rows="5"
				placeholder="// ╔════════════════════════════════════╗
// ║              EXAMPLE               ║
// ╚════════════════════════════════════╝"
			>
			</textarea>
		</div>
		<fieldset id="colorScheme">
			<label>
				<input
					type="radio"
					name="color-scheme"
					id="color-scheme-light"
					value="0"
					class="radio-toprightbutton"
				/>
				<img
					class="toprighticon"
					src="assets/ico/sun.svg"
				/>
			</label>
			<label>
				<input
					type="radio"
					name="color-scheme"
					value="auto"
					checked
					class="radio-toprightbutton"
				/>
				<img
					class="toprighticon"
					src="assets/ico/computer.svg"
					alt="Automatic light/dark mode"
				/>
			</label>
			<label>
				<input
					type="radio"
					name="color-scheme"
					id="color-scheme-dark"
					value="1"
					class="radio-toprightbutton"
				/>
				<img
					class="toprighticon"
					src="assets/ico/moon.svg"
					alt="Dark mode"
				/>
			</label>
			<div id="sociallinks">
				<a
					href="https://github.com/nouxinf/comment-box-generator"
					target="_blank"
					><img
						class="toprighticon"
						src="assets/ico/github.svg"
					/>
				</a>
				<a
					href="https://stardance.hackclub.com/projects/44282"
					target="_blank"
				>
					<img
						class="toprighticon"
						src="assets/ico/hackclub.svg"
					/>
				</a>
				<a
					href="javascript:document.getElementById('infodialog').showModal()"
				>
					<img
						class="toprighticon"
						src="assets/ico/info.svg"
					/>
				</a>
			</div>
		</fieldset>
		<dialog
			id="infodialog"
			closedby="any"
		>
			<h2>About</h2>
			<p>
				Comment Box Generator is a tool that lets you generate comment
				boxes for various programming languages.
			</p>
			<h3>Attribution</h3>
			<p>SVG icons by Fontawesome</p>
		</dialog>
		<script src="main.js"></script>
	</body>
</html>
