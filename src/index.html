<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<title>Comment Box Generator</title>
		<link
			rel="stylesheet"
			href="styles.css"
		/>
	</head>
	<body>
		<h1>Comment Box Generator</h1>
		<form
			id="mainform"
			autocomplete="off"
		>
			<label>
				Text
				<input
					id="text"
					type="text"
					name="text"
				/>
			</label>
			<label>
				Minimum width
				<input
					id="minwidth"
					type="number"
					name="minwidth"
					value="40"
				/>
			</label>
			<label>
				Comment type
				<select
					name="commenttype"
					id="commenttype"
				>
					<option value="python">Python/Bash (#)</option>
					<option value="c">C/JavaScript (//)</option>
					<option value="sql">SQL (--)</option>
					<option value="asm">Assembly (;)</option>
					<option value="html">HTML (&lt;!-- --&gt;)</option>
				</select>
			</label>
			<label>
				Multiline? (required for some languages)
				<label
					>Yes
					<input
						type="radio"
						name="ismultiline"
						value="yes"
					/>
				</label>
				<label
					>No
					<input
						type="radio"
						name="ismultiline"
						value="no"
						checked
					/>
				</label>
			</label>
			<label>
				Box Symbol
				<input
					type="text"
					maxlength="1"
					id="boxsymbol"
					name="boxsymbol"
					value="="
				/>
			</label>
			<input
				id="submit"
				type="submit"
				value="Submit"
			/>
		</form>
		<p>Output:</p>
		<textarea
			id="output"
			readonly
			cols="60"
			rows="5"
			placeholder="# ======================================
# =          HELPER FUNCTIONS          =
# ======================================"
		>
		</textarea>
		<!-- temp - gonna be replaced soon-->
		<fieldset id="colorScheme">
			<label>
				<input
					type="radio"
					name="color-scheme"
					id="color-scheme-light"
					value="0"
				/>
				Light
			</label>
			<label>
				<input
					type="radio"
					name="color-scheme"
					value="auto"
					checked
				/>
				Auto
			</label>
			<label>
				<input
					type="radio"
					name="color-scheme"
					id="color-scheme-dark"
					value="1"
				/>
				Dark
			</label>
		</fieldset>
		<script src="main.js"></script>
	</body>
</html>
